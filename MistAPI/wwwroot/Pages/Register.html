<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Mist Game Application</title>

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="container">
        <h1>MIST</h1>
        <div id="register-section">
            <h2>Create Account</h2>

            <input type="text" id="regUser" placeholder="Username">
            <input type="email" id="regEmail" placeholder="Email">
            <input type="password" id="regPass" placeholder="Password">

            <button id="registerBtn" onclick="register()">Register</button>
            <div id="regMsg"></div>

            <button type="button" onclick="window.location.href='Login.html'">Back to Login</button>
        </div>
    </div>
    <script src="../JavaScripts/config.js"></script>
    <script src="../JavaScripts/commonAuthentication.js"></script>
    <script src="../JavaScripts/Register.js"></script>
</body>
</html>

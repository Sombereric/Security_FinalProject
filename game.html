<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mist Game Application</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  height: 100vh;
}

/* Layout */
.mainDiv {
  display: flex;
  height: 100vh;
}

.left-panel {
  width: 40%;
  background: #f0f0f0;
  padding: 20px;
  overflow-y: auto;
  border-right: 2px solid #999;
}

.right-panel {
  width: 60%;
  padding: 20px;
  overflow-y: auto;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

.error { color: red; font-size: 0.9em; }
.success { color: green; font-size: 0.9em; }

input, select {
  width: 100%;
  margin-bottom: 10px;
  padding: 6px;
}

button {
  padding: 6px 10px;
  margin-top: 5px;
  cursor: pointer;
}

.gameBox {
  border: 1px solid #999;
  padding: 10px;
  margin-bottom: 10px;
}

</style>
</head>

<body>

<div class="mainDiv">

<!-- LEFT PANEL -->
<div class="left-panel">

<h1>Mist</h1>

<h2>Register</h2>
<input type="text" id="regUser" placeholder="Username">
<input type="email" id="regEmail" placeholder="Email">
<input type="password" id="regPass" placeholder="Password">
<button onclick="register()">Register</button>
<div id="regMsg" class="success"></div>

<hr>

<h2>Login</h2>
<input type="email" id="loginEmail" placeholder="Email">
<input type="password" id="loginPass" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="logout()">Logout</button>
<div id="loginMsg" class="success"></div>

<hr>

<h2>Search Games</h2>
<input type="text" id="searchTitle" placeholder="Title">
<select id="searchGenre">
  <option value="">All Genres</option>
  <option>Action</option>
  <option>RPG</option>
  <option>Sports</option>
</select>
<button onclick="searchGames()">Search</button>

</div>

<!-- RIGHT PANEL -->
<div class="right-panel">

<h2>Game Catalogue</h2>
<div id="games"></div>

<hr>

<h2>Your Game Library</h2>
<div id="library"></div>

</div>

</div>

<script>

let currentUser = null;

let games = [
  {id:1, title:"Apex legends", genre:"Action", price:10},
  {id:2, title:"Pokemon Pearl", genre:"RPG", price:30},
  {id:3, title:"NBA 2K26", genre:"Sports", price:60}
];

let userStore = {}
function register(){
  let email = document.getElementById("regEmail").value;
  let pass = document.getElementById("regPass").value;

  if(!email || !pass){
    alert("Fill all fields");
    return;
  }

  localStorage.setItem(email, pass);
  document.getElementById("regMsg").innerText = "Registered!";
}

function login(){
  let email = document.getElementById("loginEmail").value;
  let pass = document.getElementById("loginPass").value;

  if(localStorage.getItem(email) === pass){
    currentUser = email;
    document.getElementById("loginMsg").innerText = "Logged in!";
    loadLibrary();
  } else {
    alert("Invalid login");
  }
}

function logout(){
  currentUser = null;
  document.getElementById("loginMsg").innerText = "Logged out";
}

function displayGames(list){
  let div = document.getElementById("games");
  div.innerHTML = "";

  list.forEach(g=>{
    let owned = localStorage.getItem(currentUser + "_game_" + g.id);

    div.innerHTML += `
      <div class="gameBox">
        <b>${g.title}</b><br>
        ${g.genre} - $${g.price}<br>
        ${owned ? "Owned" : ""}
        <br>
        <button onclick="buy(${g.id})">Buy</button>
      </div>
    `;
  });
}

function buy(id){
  if(!currentUser){
    alert("Login first");
    return;
  }

  localStorage.setItem(currentUser + "_game_" + id, true);
  loadLibrary();
  displayGames(games);
}

//the game library
function loadLibrary(){
  let div = document.getElementById("library");
  div.innerHTML = "";

  if(!currentUser){
    div.innerHTML = "Login to see library";
    return;
  }

  games.forEach(g=>{
    if(localStorage.getItem(currentUser + "_game_" + g.id)){
      div.innerHTML += `<div>${g.title}</div>`;
    }
  });
}

function searchGames(){
  let title = document.getElementById("searchTitle").value.toLowerCase();
  let genre = document.getElementById("searchGenre").value;

  let filtered = games.filter(g=>{
    return (!title || g.title.toLowerCase().includes(title)) &&
           (!genre || g.genre === genre);
  });

  displayGames(filtered);
}

//fill the admin user table with the registered users
function loadAdmin(){
  if(!currentUser || currentUser.role !== "admin") return;
 
  let tbody = document.getElementById("adminUserTable");
  tbody.innerHTML = "";
 
  // Loop through userStore and add a row for each user
  Object.keys(userStore).forEach((email, i) => {
    let u = userStore[email];
    tbody.innerHTML += `
      <tr>
        <td>${i + 1}</td>
        <td>${u.username}</td>
        <td>${email}</td>
        <td>${u.role}</td>
        <td>${u.purchases.length}</td>
      </tr>`;
  });
}

displayGames(games);

</script>

</body>
</html>
